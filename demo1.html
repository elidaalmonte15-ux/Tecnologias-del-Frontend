<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--La etiqueta meta, a continuación es lo minimo para garantizar que 
la pagina web se muestre correctamente en diferentes dispositivos, es decir,
para que sea responsive design, que responsive no quiere decir responsable, sino
que se adapta a diferentes tamaños de pantalla -->  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introal html</title>
</head>
<body>
    <h1>Elementos block e inline</h1>
    <!-- El elemento div es el tipico elemento HTML con es block, que por las
buenas no permite que ningun otro elemento se posicione en la misma
linea horizontal que el -->

<!-- Concretamente el div es un contenedor de otros elementos HTML,
muy utilizado para el layout (diseño) visual de la paginas web -->
<div style="width: 100px; height:100px; border: 2px solid black; background-color: blue; " ></div>
<!-- Elementos inline. El span es un buen represente, es como el div
en el sentido que es un contenedor pero inline -->

</html>
