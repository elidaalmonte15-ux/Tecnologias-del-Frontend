<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>css grid layout</title>
  <style>
    body {
      font-family: sans-serif;
    }

    .container > div {
      border-radius: 5px;
      padding: 10px;
      background-color: rgb(207 232 220);
      border: 2px solid rgb(79 185 227);
    }
    .container {
      display: grid;
      grid-template-columns: 200px 200px 200px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div>une</div>
    <div>two</div>
    <div>three</div>
    <div>four</div>
    <div>five</div>
    <div>six</div>
    <div>seven</div>
  </div>
</body>

</html>
